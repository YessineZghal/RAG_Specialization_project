# Level 7's own isolated stack. Every port is intentionally non-default
# to avoid colliding with any other Qdrant/Postgres/Redis already running
# on this machine for unrelated projects (verified with `docker ps` before
# writing this file -- see README.md#setup).
#
#   docker compose -f deployment/docker-compose.yml up -d
#
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-l7-qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-l7-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: production_rag
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rag-l7-redis
    ports:
      - "16379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-l7-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rag-l7-grafana
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
