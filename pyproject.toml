[project]
name = "rag-specialization"
version = "0.1.0"
description = "A progressive, hands-on repository for learning Retrieval-Augmented Generation (RAG), from naive pipelines to production multi-agent systems."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # Core
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "rich>=13.7",
    # Structured data validation. Already an indirect dependency (fastapi
    # in the `production` extra pulls it in), promoted to a core dependency
    # here because 02-advanced-rag/metadata-filtering/self_query.py needs it
    # for every user of this repo, not only those who install `production`.
    "pydantic>=2.0",
    # Level 1 — data + ingestion
    "datasets>=2.20",
    "pypdf>=4.2",
    # Office-format ingestion (see missing_to_complite.md's RAG-Anything
    # gap review) -- pure-Python parsers, deliberately not a LibreOffice
    # dependency, so this stays runnable with `uv sync` alone.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # Level 1 — local, open-source model serving
    "ollama>=0.3",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "networkx>=3.6.1",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
# Alternative embedding backend that does not require a running Ollama server.
sentence-transformers = [
    "sentence-transformers>=3.0",
]
# Persistent vector store backend used by 01-naive-rag/examples/rag_with_qdrant.py
qdrant = [
    "qdrant-client>=1.9",
]
# Level 7's production stack: API, retrieval infra clients, observability, load testing.
production = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "locust>=2.32",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
# This repo is a learning workspace, not an installable library — each
# level's `src/` is run in place with `uv run`. Telling uv this is a
# "virtual" project skips the build/install step entirely.
package = false

[tool.pytest.ini_options]
testpaths = ["01-naive-rag/tests", "02-advanced-rag/tests", "03-modular-rag/tests", "04-adaptive-rag/tests", "05-agentic-rag/tests", "06-multi-agent-rag/tests", "07-production-rag/tests", "08-reasoning-strategies/tests", "09-knowledge-augmented-generation/tests"]
pythonpath = ["01-naive-rag", "02-advanced-rag", "02-advanced-rag/hybrid-search", "03-modular-rag", "04-adaptive-rag", "05-agentic-rag", "06-multi-agent-rag", "07-production-rag", "08-reasoning-strategies", "09-knowledge-augmented-generation"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
